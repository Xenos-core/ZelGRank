name: ZelGRank
version: '${project.version}'
main: com.zelg.zelgrank.ZelGRank
api-version: '1.21'
folia-supported: true
author: Macronis
description: Give, renew and remove LuckPerms ranks with one command
website: https://github.com/Xenos-core/ZelGRank
depend: [LuckPerms]
softdepend: [PlaceholderAPI]

commands:
  giverank:
    description: Give or extend a player's rank
    usage: /giverank <player> <rank> [duration] [-s]
    aliases: [grank, givegroup]
  demote:
    description: Remove a rank from a player
    usage: /demote <player> <rank>
    aliases: [removerank, takerank]
  ginfo:
    description: See a player's ranks and when they expire
    usage: /ginfo <player>
    aliases: [groupinfo, rankinfo]
  zelgrank:
    description: Reload ZelGRank
    usage: /zelgrank reload
    aliases: [zgr, zrank]

permissions:
  zelgrank.admin:
    description: Everything in ZelGRank
    default: op
    children:
      zelgrank.give: true
      zelgrank.demote: true
      zelgrank.info: true
      zelgrank.reload: true
      zelgrank.notify: true
  zelgrank.give:
    description: Use /giverank
    default: op
  zelgrank.demote:
    description: Use /demote
    default: op
  zelgrank.info:
    description: Use /ginfo
    default: op
  zelgrank.reload:
    description: Use /zelgrank reload
    default: op
  zelgrank.notify:
    description: See purchase broadcasts when recipients is set to staff
    default: op
