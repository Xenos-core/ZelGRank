# ZelGRank config
# Messages live in messages.yml. Run /zelgrank reload after editing either file.

# Purchase announcement sent when someone is given a rank.
# Add -s to /giverank to give a rank quietly, e.g. /giverank Steve VIP 30d -s
broadcast:
  enabled: true
  # all = everyone online, staff = only players with staff-permission
  recipients: all
  staff-permission: "zelgrank.notify"
  # <player> <rank> <duration> <price>
  lines:
    - ""
    - "<gradient:#3CE68C:#16A34A><strikethrough>                                        </strikethrough></gradient>"
    - "        <gradient:#3CE68C:#16A34A><bold>✦ RANK PURCHASE ✦</bold></gradient>"
    - ""
    - "  <gray>Player</gray> <white><player>"
    - "  <gray>Rank</gray> <green><bold><rank></bold>"
    - "  <gray>Length</gray> <white><duration>"
    - "  <gray>Price</gray> <green>$<price>"
    - ""
    - "  <gray>Thanks for supporting the server!"
    - "<gradient:#3CE68C:#16A34A><strikethrough>                                        </strikethrough></gradient>"
    - ""
  sound:
    enabled: true
    # any sound key, like entity.player.levelup or ui.toast.challenge_complete
    name: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.0

# Price shown in the broadcast as <price>. Group names are matched case-insensitively.
# A rank can have one price, or a price per duration with "permanent" and "default" as extras.
rank-prices:
  default: "0.00"
  vip:
    7d: "4.99"
    30d: "9.99"
    permanent: "29.99"
    default: "9.99"
  mvp: "29.99"

# Warn players on join when one of their temporary ranks ends soon.
expiry-warning:
  enabled: true
  # how close to expiry a rank has to be, same format as /giverank (12h, 3d...)
  within: 24h
  # wait a bit after join so the warning isn't buried under join messages
  delay-ticks: 40
