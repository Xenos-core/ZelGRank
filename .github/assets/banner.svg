<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05140C"/><stop offset="1" stop-color="#0A2316"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9F6D2"/><stop offset="0.5" stop-color="#3CE68C"/><stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3CE68C" stop-opacity="0"/><stop offset="0.5" stop-color="#3CE68C"/><stop offset="1" stop-color="#3CE68C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#3CE68C" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="900" height="220" rx="18" fill="url(#bg)"/>
  <rect width="900" height="220" rx="18" fill="url(#grid)"/>
  <g transform="translate(450 92)" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text font-size="64" font-weight="800" fill="url(#title)" letter-spacing="1">ZelGRank</text>
    <rect x="-200" y="22" width="400" height="2" fill="url(#line)"/>
    <text y="62" font-size="20" fill="#7FE7AE">LuckPerms ranks in one command.</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#3CE68C" fill-opacity="0.35">
    <text x="36" y="44">/giverank Steve vip 30d</text>
    <text x="736" y="44">/demote Alex mvp</text>
    <text x="36" y="196">%zelgrank_rank%</text>
    <text x="744" y="196">Paper · Folia</text>
  </g>
</svg>
