name: ZelGRank Build

on:
  push:
    branches: [ ZelGRank ]
  pull_request:
    branches: [ ZelGRank ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ZelGRank
          path: target/ZelGRank-*.jar
