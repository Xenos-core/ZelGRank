name: ZelGRank Release

# Builds the jar and attaches it to a release when it's published,
# so nobody has to upload it by hand.
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  attach-jar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/ZelGRank-*.jar --clobber
